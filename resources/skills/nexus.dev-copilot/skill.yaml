id: nexus.dev-copilot
version: 1.3.2
name:
  zh-CN: Nexus 全栈研发与本地工程副驾驶
  en-US: Nexus Full-Stack Dev Copilot
description:
  zh-CN: 专为 Nexus 1.3.2 打造的端到端本地工程交付智能体。无需浏览器，纯靠本地文件系统、CLI 终端与进程控制，自主闭环：环境感知、代码编辑、编译构建、测试自愈与 Git 提交。
  en-US: End-to-end local engineering copilot designed for Nexus 1.3.2. Operates entirely via local filesystem, CLI terminal, and process management. Autonomously handles discovery, atomic edits, build verification, test healing, and git commits.
category: engineering
risk: medium
triggers:
  - 帮我写代码
  - 帮我开发
  - 修复bug
  - 跑一下测试
  - 编译项目
  - 启动项目
  - 检查代码
  - 项目报错
  - 自动修复
  - fullstack dev
  - dev copilot
  - fix bug
  - run tests
  - build project
  - project memory
tools:
  - localbridge_project_list
  - localbridge_project_info
  - localbridge_directory_list
  - localbridge_file_read
  - localbridge_file_write
  - localbridge_file_stat
  - localbridge_command_run
  - localbridge_process_list
  - localbridge_code_diagnostics
  - command_run
  - file_read
  - file_write
  - file_list
workflow:
  - discover_project_context
  - read_target_context
  - plan_atomic_mutation
  - apply_code_changes
  - verify_build_and_tests
  - self_heal_on_failure
  - sync_project_memory
  - review_git_status
enabled: true
