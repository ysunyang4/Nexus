name: Sponsor & Asset Integrity Verification

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: Verify Sponsor Channels & Address
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Binance UID and On-Chain Address in Documentation
        run: |
          grep -q "1292741809" README.md || (echo "::error::Binance UID missing or modified in README.md" && exit 1)
          grep -q "TPRrDW8DGsrDmcnWvanTbFz7XEJuywu21i" README.md || (echo "::error::USDT TRC-20 address missing or modified in README.md" && exit 1)
          grep -q "1292741809" docs/README.zh-CN.md || (echo "::error::Binance UID missing or modified in docs/README.zh-CN.md" && exit 1)
          grep -q "TPRrDW8DGsrDmcnWvanTbFz7XEJuywu21i" docs/README.zh-CN.md || (echo "::error::USDT TRC-20 address missing or modified in docs/README.zh-CN.md" && exit 1)
          echo "All sponsor channels and addresses verified successfully."
